# nginx config of lod-am.net: the static site from the `deploy` branch, on port 8080 behind
# Nginx Proxy Manager (TLS, public name). Copy to /etc/nginx/sites-available/lod-am (a file that
# nginx includes inside its `http { }` block, as on Debian/Ubuntu); see docs/deployment.md.
# Tested with scripts/check_conneg.sh against a local nginx (website#19).

# Content negotiation for record IRIs (website#19): the representation a client asks for in its
# Accept header. Browsers don't ask for RDF, so they get the HTML page; anything not understood
# gets it too. (A plain substring match: an Accept header that lists Turtle at a lower q than
# HTML still gets Turtle; RDF clients don't send that.)
map $http_accept $lodam_representation {
    default                    "/";
    "~*text/turtle"            ".ttl";
    "~*application/ld\+json"   ".jsonld";
}

server {
    listen 8080;
    server_name _;

    # the deploy checkout (docs/deployment.md, "Server setup")
    root /var/www/lod-am.net;   # your document root: the deploy checkout (keep your current line)
    index index.html;

    # the site's own 404 page instead of nginx's default one
    error_page 404 /404.html;

    # Redirects carry only the path ("/id/…/"). Without this, nginx behind the proxy builds
    # "http://lod-am.net:8080/…", which visitors can't reach (seen live on 2026-11-23 for
    # record IRIs without the trailing slash).
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    # never serve git metadata (the deploy checkout has .git/ inside the root)
    location ~ /\.git {
        return 404;
    }

    # Record IRIs (https://lod-am.net/id/<kind>/<uuid>, no trailing slash) name finds, sites,
    # analyses …, not web pages. 303 See Other to the document the client asked for:
    #   Accept: text/turtle          -> /id/<kind>/<uuid>.ttl
    #   Accept: application/ld+json  -> /id/<kind>/<uuid>.jsonld
    #   anything else (browsers)     -> /id/<kind>/<uuid>/   (the HTML page)
    location ~ "^/id/[a-z]+/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" {
        add_header Vary Accept always;
        add_header Access-Control-Allow-Origin "*" always;
        return 303 $uri$lodam_representation;
    }

    # RDF downloads with their media types (not octet-stream), readable from other sites'
    # scripts (CORS): /data/*.ttl, /data/void.ttl, /id/<kind>/<uuid>.ttl and .jsonld.
    # `types` inside a location replaces the MIME map only there.
    location ~* \.ttl$ {
        types { }
        default_type text/turtle;
        charset utf-8;
        charset_types text/turtle;
        add_header Access-Control-Allow-Origin "*" always;
    }
    location ~* \.jsonld$ {
        types { }
        default_type application/ld+json;
        charset utf-8;
        charset_types application/ld+json;
        add_header Access-Control-Allow-Origin "*" always;
    }

    gzip on;
    # text/html is always compressed; the rest only if listed
    gzip_types text/css application/javascript application/json application/ld+json
               text/xml application/xml application/atom+xml image/svg+xml text/turtle;
}
